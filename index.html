<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MT4 Emergency Control</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; margin: 0; user-select: none; }
        .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .label { font-size: 12px; color: #94a3b8; text-transform: uppercase; }
        .value { font-size: 26px; font-weight: bold; margin-top: 4px; }
        
        .slider-wrapper { margin-top: 24px; text-align: center; }
        .slider-label { font-size: 13px; font-weight: bold; color: #ef4444; margin-bottom: 8px; display: block; letter-spacing: 0.5px; }
        
        /* Slider Native Range stilizzato per compatibilità perfetta mouse/touch/Telegram Desktop */
        .range-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 54px;
            background: #334155;
            border-radius: 27px;
            outline: none;
            padding: 4px;
            box-sizing: border-box;
        }

        /* Bottone da trascinare (Thumb) */
        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #ef4444;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.5);
            transition: background 0.2s;
        }

        .range-slider::-moz-range-thumb {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #ef4444;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.5);
        }

        .btn-direct { background: #dc2626; color: white; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: bold; width: 100%; margin-top: 20px; cursor: pointer; box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3); }
        .btn-direct:active { opacity: 0.8; transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="card">
        <div class="label">Equity Conto</div>
        <div class="value" id="equity">€ --</div>
    </div>

    <div style="display: flex; gap: 10px;">
        <div class="card" style="flex:1;">
            <div class="label">Saldo</div>
            <div class="value" id="balance" style="font-size:20px;">€ --</div>
        </div>
        <div class="card" style="flex:1;">
            <div class="label">Ordini Aperti</div>
            <div class="value" id="orders" style="font-size:20px;">--</div>
        </div>
    </div>

    <!-- Slider Native HTML5 Range -->
    <div class="slider-wrapper">
        <span class="slider-label">SCORRI A DESTRE DOPO IL 90% PER ARRESTARE</span>
        <input type="range" min="0" max="100" value="0" class="range-slider" id="killRange">
    </div>

    <!-- Pulsante d'Emergenza Diretto (alternativo al drag) -->
    <button class="btn-direct" onclick="triggerEmergency()">PULSANTE ARRESTO D'EMERGENZA</button>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        async function updateData() {
            try {
                const res = await fetch('/api/app/status');
                const data = await res.json();
                document.getElementById('equity').innerText = '€ ' + (data.equity !== undefined ? data.equity.toFixed(2) : '0.00');
                document.getElementById('balance').innerText = '€ ' + (data.balance !== undefined ? data.balance.toFixed(2) : '0.00');
                document.getElementById('orders').innerText = data.openOrders || 0;
            } catch (e) { console.error(e); }
        }

        // Gestione Slider Range
        const range = document.getElementById('killRange');

        range.addEventListener('input', function() {
            if (this.value >= 90) {
                this.value = 100;
                triggerEmergency();
            }
        });

        range.addEventListener('change', function() {
            if (this.value < 90) {
                this.value = 0; // Ritorna all'inizio se rilasciato prima della fine
            }
        });

        async function triggerEmergency() {
            if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            
            if (confirm("ATTENZIONE: Confermi di voler attivare il KILL SWITCH? Tutte le posizioni su MT4 verranno chiuse.")) {
                await fetch('/api/app/emergency-stop', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ stop: true })
                });
                alert("KILL SWITCH ATTIVATO! Comando inviato a MT4.");
            }
            range.value = 0; // Reset posizione slider
        }

        setInterval(updateData, 2000);
        updateData();
    </script>
</body>
</html>
