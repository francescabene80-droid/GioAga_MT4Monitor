<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT4 Controllo Remoto</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#121212">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
            color: #ffffff;
        }
        .card {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .card label {
            font-size: 0.85rem;
            color: #9e9e9e;
        }
        .card .value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffffff;
            margin-top: 5px;
        }
        .btn-kill {
            background-color: #d32f2f;
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.4);
        }
        .btn-kill:active {
            background-color: #b71c1c;
        }
        .status-online {
            text-align: center;
            font-size: 0.8rem;
            color: #4caf50;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>MT4 Monitor & Kill Switch</h1>
    
    <div class="card">
        <label>SALDO</label>
        <div class="value" id="balance">Caricamento...</div>
    </div>

    <div class="card">
        <label>EQUITY</label>
        <div class="value" id="equity">Caricamento...</div>
    </div>

    <div class="card">
        <label>POSIZIONI APERTE</label>
        <div class="value" id="trades">Caricamento...</div>
    </div>

    <button class="btn-kill" onclick="triggerKillSwitch()">🚨 KILL SWITCH (CHIUDI TUTTO)</button>
    <div class="status-online" id="connection-status">Connesso al server Render</div>
</div>

<script>
    const apiKey = "METTI_QUI_LA_TUA_API_KEY"; // Oppure gestisci il token dinamicamente

    async function fetchData() {
        try {
            const response = await fetch(`/api/app/status?key=${apiKey}`);
            const data = await response.json();
            
            document.getElementById('balance').innerText = `$${data.balance || '0.00'}`;
            document.getElementById('equity').innerText = `$${data.equity || '0.00'}`;
            document.getElementById('trades').innerText = data.openTrades || '0';
        } catch (e) {
            console.error("Errore di connessione", e);
        }
    }

    async function triggerKillSwitch() {
        if (confirm("ATTENZIONE: Vuoi davvero chiudere tutte le operazioni aperte su MT4?")) {
            try {
                const response = await fetch(`/api/app/kill?key=${apiKey}`, { method: 'POST' });
                alert("Comando Kill Switch inviato con successo!");
            } catch (e) {
                alert("Errore nell'invio del comando.");
            }
        }
    }

    // Aggiorna i dati ogni 5 secondi
    setInterval(fetchData, 5000);
    fetchData();
</script>

</body>
</html>
