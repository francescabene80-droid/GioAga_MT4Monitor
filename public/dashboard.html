<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT4 Controllo Remoto</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#121212">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        h1 {
            font-size: 1.3rem;
            text-align: center;
            margin-bottom: 15px;
            color: #ffffff;
        }
        .account-card {
            background: #1e1e1e;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border-left: 4px solid #ff9800;
        }
        .account-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            font-weight: bold;
            color: #ff9800;
            margin-bottom: 8px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        .row label {
            color: #9e9e9e;
        }
        .row .value {
            font-weight: bold;
            color: #ffffff;
        }
        .profit-pos { color: #4caf50 !important; }
        .profit-neg { color: #d32f2f !important; }

        .btn-kill-small {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(211, 47, 47, 0.3);
        }
        .btn-kill-small:active {
            background-color: #b71c1c;
        }

        .summary-card {
            background: #252525;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #2196f3;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .summary-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: #2196f3;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
            text-align: center;
        }

        .status-online {
            text-align: center;
            font-size: 0.8rem;
            color: #4caf50;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>MT4 Monitor & Control</h1>
    
    <!-- Contenitore dinamico della lista conti e del riepilogo finale -->
    <div id="dashboard-container">
        <div class="account-card" style="text-align: center; color: #9e9e9e;">Caricamento dati in corso...</div>
    </div>

    <div class="status-online" id="connection-status">Connesso al server Render</div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const apiKey = urlParams.get('key') || "paperino"; 

    async function fetchData() {
        try {
            const response = await fetch(`/api/app/status?key=${apiKey}`);
            if (!response.ok) throw new Error("Non autorizzato");
            
            const rawData = await response.json();
            const container = document.getElementById('dashboard-container');
            container.innerHTML = ''; 

            let accountCount = 0;
            let sumBalance = 0;
            let sumProfit = 0;

            let listsHTML = '';

            // Cicla su tutti i conti ricevuti
            for (const accId in rawData) {
                if (rawData.hasOwnProperty(accId)) {
                    const acc = rawData[accId];
                    accountCount++;

                    const b = Number(acc.balance || 0);
                    const e = Number(acc.equity || 0);
                    const p = Number(acc.profit || acc.openFloating || 0);
                    const fullAccNum = acc.accountNumber || accId;
                    const maskedAcc = "..." + fullAccNum.slice(-4); // Prende solo le ultime 4 cifre

                    sumBalance += b;
                    sumProfit += p;

                    const profitClass = p >= 0 ? 'profit-pos' : 'profit-neg';

                    // Riga / Scheda per il singolo conto con pulsante Kill dedicato
                    listsHTML += `
                        <div class="account-card">
                            <div class="account-header">
                                <span>Conto: ${maskedAcc}</span>
                                <button class="btn-kill-small" onclick="triggerKillSwitch('${fullAccNum}')">🚨 KILL</button>
                            </div>
                            <div class="row">
                                <label>Saldo:</label>
                                <span class="value">$${b.toFixed(2)}</span>
                            </div>
                            <div class="row">
                                <label>Equity:</label>
                                <span class="value">$${e.toFixed(2)}</span>
                            </div>
                            <div class="row">
                                <label>Floating:</label>
                                <span class="value ${profitClass}">$${p.toFixed(2)}</span>
                            </div>
                        </div>
                    `;
                }
            }

            if (accountCount === 0) {
                container.innerHTML = '<div class="account-card" style="text-align: center; color: #ff9800;">Nessun conto attivo trovato</div>';
                return;
            }

            // Blocco di riepilogo totale in fondo alla lista
            const totalProfitClass = sumProfit >= 0 ? 'profit-pos' : 'profit-neg';
            const summaryHTML = `
                <div class="summary-card">
                    <div class="summary-title">📊 RIEPILOGO GLOBALE (${accountCount} ${accountCount === 1 ? 'Conto' : 'Conti'})</div>
                    <div class="row">
                        <label>Totale Saldi:</label>
                        <span class="value">$${sumBalance.toFixed(2)}</span>
                    </div>
                    <div class="row">
                        <label>Profitto Totale:</label>
                        <span class="value ${totalProfitClass}">$${sumProfit.toFixed(2)}</span>
                    </div>
                </div>
            `;

            // Mostra prima la lista dei conti, poi il riepilogo in fondo
            container.innerHTML = listsHTML + summaryHTML;

            document.getElementById('connection-status').innerText = `Connesso - ${accountCount} ${accountCount === 1 ? 'conto attivo' : 'conti attivi'}`;
            document.getElementById('connection-status').style.color = "#4caf50";
        } catch (e) {
            console.error("Errore di connessione", e);
            document.getElementById('connection-status').innerText = "Errore: API Key non valida o offline";
            document.getElementById('connection-status').style.color = "#d32f2f";
        }
    }

    async function triggerKillSwitch(accountNumber) {
        if (confirm(`ATTENZIONE: Vuoi chiudere tutte le operazioni aperte sul conto ${accountNumber}?`)) {
            try {
                // Passa anche l'account se il backend lo supporta, oppure richiama l'endpoint standard
                const response = await fetch(`/api/app/kill?key=${apiKey}&account=${accountNumber}`, { method: 'POST' });
                if (response.ok) {
                    alert(`Comando Kill Switch inviato per il conto ${accountNumber}!`);
                } else {
                    alert("Errore durante l'invio del comando.");
                }
            } catch (e) {
                alert("Errore nella connessione al server.");
            }
        }
    }

    // Aggiorna i dati ogni 5 secondi
    setInterval(fetchData, 5000);
    fetchData();
</script>

</body>
</html>
